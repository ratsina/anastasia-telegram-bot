services:
  - type: web
    name: anastasia-instagram-webhook
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_VERSION
        value: v24.0
      - key: TELEGRAM_BOT_USERNAME
        value: anastasia_lfk_massage_bot
